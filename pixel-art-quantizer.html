<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Grid Quantizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #4a9eff;
            font-size: 2em;
        }

        .controls {
            background: #2a2a2a;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #b0b0b0;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            border-radius: 5px;
            color: #e0e0e0;
            cursor: pointer;
        }

        input[type="file"]::file-selector-button {
            background: #4a9eff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background: #3a8eef;
        }

        input[type="number"],
        input[type="range"] {
            width: 100%;
            padding: 10px;
            background: #3a3a3a;
            border: 2px solid #4a4a4a;
            border-radius: 5px;
            color: #e0e0e0;
        }

        input[type="range"] {
            padding: 0;
        }

        .slider-value {
            display: inline-block;
            margin-left: 10px;
            padding: 5px 12px;
            background: #3a3a3a;
            border-radius: 4px;
            font-weight: bold;
            color: #4a9eff;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #processBtn {
            background: #4a9eff;
            color: white;
        }

        #processBtn:hover:not(:disabled) {
            background: #3a8eef;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(74, 158, 255, 0.3);
        }

        #downloadBtn {
            background: #2ecc71;
            color: white;
        }

        #downloadBtn:hover:not(:disabled) {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }

        .canvas-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .canvas-wrapper {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .canvas-wrapper h2 {
            margin-bottom: 15px;
            color: #4a9eff;
            font-size: 1.3em;
            text-align: center;
        }

        .canvas-holder {
            background: #1a1a1a;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }

        .info-text {
            text-align: center;
            color: #777;
            padding: 40px;
        }

        .stats {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: #b0b0b0;
        }

        @media (max-width: 968px) {
            .canvas-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pixel Art Grid Quantizer</h1>

        <div class="controls">
            <div class="control-group">
                <label for="imageInput">Upload Image (768x1024 recommended)</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="control-group">
                <label for="gridSize">Grid Size (pixels per block)</label>
                <input type="number" id="gridSize" min="1" max="16" value="4">
            </div>

            <div class="control-group">
                <label for="threshold">
                    Solidity Threshold: <span class="slider-value" id="thresholdValue">8</span>
                    <span style="font-size: 12px; color: #888; display: block; margin-top: 5px;">
                        Lower = Keep more detail | Higher = Remove more noise
                    </span>
                </label>
                <input type="range" id="threshold" min="1" max="16" value="8">
            </div>

            <div class="button-group">
                <button id="processBtn" disabled>Process Image</button>
                <button id="downloadBtn" disabled>Download Result</button>
            </div>
        </div>

        <div class="canvas-container">
            <div class="canvas-wrapper">
                <h2>Original</h2>
                <div class="canvas-holder" id="originalHolder">
                    <div class="info-text">Upload an image to begin</div>
                </div>
            </div>

            <div class="canvas-wrapper">
                <h2>Processed</h2>
                <div class="canvas-holder" id="processedHolder">
                    <div class="info-text">Click "Process Image" to see result</div>
                </div>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const gridSizeInput = document.getElementById('gridSize');
        const thresholdInput = document.getElementById('threshold');
        const thresholdValue = document.getElementById('thresholdValue');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const originalHolder = document.getElementById('originalHolder');
        const processedHolder = document.getElementById('processedHolder');
        const statsDiv = document.getElementById('stats');

        let originalCanvas = null;
        let processedCanvas = null;
        let sourceImage = null;

        // Update threshold display
        thresholdInput.addEventListener('input', (e) => {
            thresholdValue.textContent = e.target.value;
        });

        // Handle image upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    sourceImage = img;
                    displayOriginal(img);
                    processBtn.disabled = false;
                    downloadBtn.disabled = true;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Display original image
        function displayOriginal(img) {
            originalHolder.innerHTML = '';
            originalCanvas = document.createElement('canvas');
            originalCanvas.width = img.width;
            originalCanvas.height = img.height;

            const ctx = originalCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            originalHolder.appendChild(originalCanvas);
        }

        // Process button
        processBtn.addEventListener('click', () => {
            if (!sourceImage) return;
            processImage();
        });

        // Download button
        downloadBtn.addEventListener('click', () => {
            if (!processedCanvas) return;

            const link = document.createElement('a');
            link.download = 'pixel-art-cleaned.png';
            link.href = processedCanvas.toDataURL('image/png');
            link.click();
        });

        // Main processing function
        function processImage() {
            const gridSize = parseInt(gridSizeInput.value);
            const threshold = parseInt(thresholdInput.value);

            // Create processed canvas
            processedCanvas = document.createElement('canvas');
            processedCanvas.width = sourceImage.width;
            processedCanvas.height = sourceImage.height;

            const sourceCtx = originalCanvas.getContext('2d');
            const destCtx = processedCanvas.getContext('2d');

            const sourceData = sourceCtx.getImageData(0, 0, sourceImage.width, sourceImage.height);
            const destData = destCtx.createImageData(sourceImage.width, sourceImage.height);

            let blocksProcessed = 0;
            let blocksFilled = 0;
            let blocksCleared = 0;

            // Process each grid block
            for (let y = 0; y < sourceImage.height; y += gridSize) {
                for (let x = 0; x < sourceImage.width; x += gridSize) {
                    const blockWidth = Math.min(gridSize, sourceImage.width - x);
                    const blockHeight = Math.min(gridSize, sourceImage.height - y);

                    const result = processBlock(sourceData, x, y, blockWidth, blockHeight);
                    fillBlock(destData, x, y, blockWidth, blockHeight, result.color);

                    blocksProcessed++;
                    if (result.isSolid) {
                        blocksFilled++;
                    } else {
                        blocksCleared++;
                    }
                }
            }

            destCtx.putImageData(destData, 0, 0);

            // Display result
            processedHolder.innerHTML = '';
            processedHolder.appendChild(processedCanvas);

            downloadBtn.disabled = false;

            // Show stats
            statsDiv.style.display = 'block';
            statsDiv.innerHTML = `
                Processed ${blocksProcessed} blocks |
                Filled: ${blocksFilled} |
                Cleared: ${blocksCleared} |
                Grid: ${gridSize}x${gridSize} |
                Threshold: ${threshold}/${gridSize * gridSize}
            `;
        }

        // Process a single block
        function processBlock(imageData, startX, startY, width, height) {
            const threshold = parseInt(thresholdInput.value);
            const colorMap = new Map();
            let solidPixelCount = 0;

            // Scan all pixels in this block
            for (let y = startY; y < startY + height; y++) {
                for (let x = startX; x < startX + width; x++) {
                    const index = (y * imageData.width + x) * 4;
                    const r = imageData.data[index];
                    const g = imageData.data[index + 1];
                    const b = imageData.data[index + 2];
                    const a = imageData.data[index + 3];

                    // Check if pixel is background (transparent)
                    const isBackground = a === 0;

                    if (!isBackground) {
                        solidPixelCount++;

                        // Create color key (ignoring fully transparent)
                        const colorKey = `${r},${g},${b},${a}`;
                        colorMap.set(colorKey, (colorMap.get(colorKey) || 0) + 1);
                    }
                }
            }

            // Decide if block is solid enough
            if (solidPixelCount >= threshold) {
                // Block is solid - find most common color
                let maxCount = 0;
                let dominantColor = null;

                for (const [colorKey, count] of colorMap.entries()) {
                    if (count > maxCount) {
                        maxCount = count;
                        dominantColor = colorKey;
                    }
                }

                if (dominantColor) {
                    const parts = dominantColor.split(',').map(Number);
                    return {
                        isSolid: true,
                        color: { r: parts[0], g: parts[1], b: parts[2], a: parts[3] }
                    };
                }
            }

            // Block is not solid enough - make it transparent
            return {
                isSolid: false,
                color: { r: 0, g: 0, b: 0, a: 0 }
            };
        }

        // Fill a block with a single color
        function fillBlock(imageData, startX, startY, width, height, color) {
            for (let y = startY; y < startY + height; y++) {
                for (let x = startX; x < startX + width; x++) {
                    const index = (y * imageData.width + x) * 4;
                    imageData.data[index] = color.r;
                    imageData.data[index + 1] = color.g;
                    imageData.data[index + 2] = color.b;
                    imageData.data[index + 3] = color.a;
                }
            }
        }
    </script>
</body>
</html>
